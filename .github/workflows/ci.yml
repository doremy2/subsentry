name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Lets you start CI by hand: Actions tab > CI > "Run workflow" (needs this file on the default branch).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, OS-independent checks (types + lint + unit/UI tests, incl. SQLite store tests).
  # Branch protection on main should require this job plus build-macos and build-windows.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Separate native runners: each OS builds and packages its own installer.
  # macOS: one build per CPU architecture instead of a universal binary. (The universal merge step
  # failed with "number of mach-o files is not the same between arm64 and x64"; separate builds avoid it.)
  # Both are cross-built on the same Apple Silicon runner: the app has no native modules.
  build-macos-packages:
    name: build-macos-packages (${{ matrix.arch }})
    needs: verify
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Optional signing: only runs when the certificate secret exists (see docs/DISTRIBUTION.md).
      - name: Import Apple signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security default-keychain -s "$RUNNER_TEMP/ci.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/ci.keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/ci.keychain"
      - name: Build .app + .dmg (${{ matrix.arch }})
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make -- --arch=${{ matrix.arch }}
      - name: Verify the app really is ${{ matrix.arch }}
        env:
          EXPECTED: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
        run: |
          BIN=$(find out -path "*darwin-$ARCH*" -path "*Contents/MacOS/*" -type f | head -1)
          echo "binary: $BIN"
          file "$BIN"
          file "$BIN" | grep -q "$EXPECTED"
      - name: Name the installer by architecture
        run: |
          # Publish the output tree as an annotation (visible without opening the raw log).
          echo "::notice title=make output ($ARCH)::$(find out/make -type f | sort | tr '\n' '|')"
          VERSION=$(node -p "require('./package.json').version")
          DMG=$(find out/make -name "*.dmg" | head -1)
          test -n "$DMG" || { echo "::error::No .dmg was produced under out/make"; exit 1; }
          mv "$DMG" "$(dirname "$DMG")/SubSentry-$VERSION-mac-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: SubSentry-macos-${{ matrix.arch }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  # Stable check name for branch protection: passes only if BOTH macOS architectures built.
  build-macos:
    needs: build-macos-packages
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require arm64 and x64 builds
        run: |
          echo "macOS package builds: ${{ needs.build-macos-packages.result }}"
          test "${{ needs.build-macos-packages.result }}" = "success"

  build-windows:
    needs: verify
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Decode Windows signing certificate
        if: env.HAS_CERT == 'true'
        shell: bash
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          echo "WINDOWS_CERT_FILE=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
      - name: Build installer
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: SubSentry-windows
          path: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/*.nupkg
            out/make/squirrel.windows/**/RELEASES
            out/make/zip/win32/**/*.zip
          if-no-files-found: error
